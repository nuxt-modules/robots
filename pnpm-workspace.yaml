  - postcss-minify-params@9.0.6
  - postcss-discard-empty@9.0.5
  - postcss-colormin@9.0.6
  - postcss-svgo@9.0.4
  - cssnano-utils@8.1.0
  - cssnano-preset-default@9.2.2
  - cssnano@9.2.2
  - chokidar
  - semver
  - undici-types
  - jose
  - tinyexec@1.2.2

shellEmulator: true

packages:
