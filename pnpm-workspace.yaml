  - playground
  - '!examples/**'

overrides:
  cssnano: 9.2.2
  cssnano-preset-default: 9.2.2
  cssnano-utils: 8.1.0
  # Keep module runtime imports on the Nitro version used by Nuxt's server builder.
  nitropack: 2.13.6
  nuxt-site-config: https://pkg.pr.new/harlan-zw/nuxt-site-config/nuxt-site-config@b8c8a6978ce818d77ecc50c679d412e748fdbdcb
